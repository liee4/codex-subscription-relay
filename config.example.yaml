# 运行 `node init-config.mjs`，生成仅供自己使用的 config.yaml 和 api-key.txt。
# 本示例文件不含可用的凭证。
config-version: 8
server:
  host: "127.0.0.1"
  port: 8317
management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
access:
  api-keys:
    - "REPLACE_WITH_RANDOM_PRIVATE_KEY"
oauth:
  auth-dir: "REPLACE_WITH_ABSOLUTE_LOCAL_AUTH_DIRECTORY"

